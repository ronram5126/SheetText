name: Release

on:
  push:
    branches:
      - 'publish'
  workflow_dispatch:
  

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build release package
        run: npm run release && echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
        id: package
        continue-on-error: false

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        id: release
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: Release ${{ steps.package.outputs.version }}
          files: |
            dist/release/sheettext-excel-${{ steps.package.outputs.version }}.zip
            dist/release/sheettext-onlyoffice-${{ steps.package.outputs.version }}.zip
